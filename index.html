<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Movie Recommendation</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Movie Recommendation</h1>
      <p>Enter a movie title to get recommendations based on it</p>
    </header>
    
    <div class="search-container">
      <input type="text" id="movie-input" placeholder="Enter movie name...">
      <button id="recommend-btn">Get Recommendations</button>
    </div>

    <div class="recommendations" id="recommendations">
      <!-- Movie recommendations will appear here -->
    </div>
  </div>

  <footer>
    <p>Powered by Your Movie API</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
